[package]
name = "anode-chaos-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Test harness
anode-test-harness = { path = "../harness" }
anode-client = { path = "../../crates/anode-client" }

# Async runtime
tokio = { version = "1.41", features = ["full", "test-util", "macros"] }
async-trait = "0.1"

# Random generation
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Docker API for container management
bollard = "0.18"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Testing utilities
futures = "0.3"
bytes = "1.9"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Network manipulation
nix = { version = "0.29", features = ["net"] }

# Temporary files for testing
tempfile = "3.8"

[[test]]
name = "node_crash"
path = "tests/node_crash.rs"

[[test]]
name = "network_partition"
path = "tests/network_partition.rs"

[[test]]
name = "disk_failure"
path = "tests/disk_failure.rs"

[[test]]
name = "slow_network"
path = "tests/slow_network.rs"

[[test]]
name = "rolling_restart"
path = "tests/rolling_restart.rs"

[[test]]
name = "split_brain"
path = "tests/split_brain.rs"

[[test]]
name = "cascade_failure"
path = "tests/cascade_failure.rs"

[[test]]
name = "minority_cannot_write"
path = "tests/minority_cannot_write.rs"

[[test]]
name = "leader_crash_during_write"
path = "tests/leader_crash_during_write.rs"

[[test]]
name = "corrupt_chunk"
path = "tests/corrupt_chunk.rs"

[[test]]
name = "majority_can_write"
path = "tests/majority_can_write.rs"

[[test]]
name = "full_cluster_restart"
path = "tests/full_cluster_restart.rs"
