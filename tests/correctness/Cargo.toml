[package]
name = "anode-correctness-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Test harness
anode-test-harness = { path = "../harness" }

# Async runtime
tokio = { version = "1.41", features = ["full", "test-util"] }
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Testing utilities
futures = "0.3"
rand = "0.10"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Time utilities
chrono = "0.4"

[dev-dependencies]
test-log = "0.2"
