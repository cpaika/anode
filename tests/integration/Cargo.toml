[package]
name = "anode-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "anode_integration_tests"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "cluster_bootstrap"
path = "tests/cluster_bootstrap.rs"

[[test]]
name = "https_server"
path = "tests/https_server.rs"

[dependencies]
# Test harness
anode-test-harness = { path = "../harness" }
anode-client = { path = "../../crates/anode-client" }

# Anode crates for cluster bootstrap testing and HTTPS testing
anode = { path = "../../crates/anode" }
anode-raft = { path = "../../crates/anode-raft" }
anode-storage = { path = "../../crates/anode-storage" }
anode-protocol = { path = "../../crates/anode-protocol" }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }

# Async runtime
tokio = { version = "1.41", features = ["full", "test-util"] }
async-trait = "0.1"

# AWS SDK for integration testing
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"

# Utilities
rand = "0.9"
tempfile = "3.14"
bytes = "1.9"
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
serial_test = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = "0.4"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-native-roots"] }
