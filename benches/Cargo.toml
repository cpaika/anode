[package]
name = "anode-bench"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "storage"
harness = false
path = "storage.rs"

[[bench]]
name = "throughput"
harness = false
path = "throughput.rs"

[[bench]]
name = "latency"
harness = false
path = "latency.rs"

[[bench]]
name = "memory"
harness = false
path = "memory.rs"

[[bench]]
name = "parquet"
harness = false
path = "parquet.rs"

[dependencies]
anode-storage = { path = "../crates/anode-storage" }
anode-protocol = { path = "../crates/anode-protocol" }
anode-client = { path = "../crates/anode-client" }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
tempfile = "3"
bytes = "1"
sysinfo = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
anyhow = "1"
