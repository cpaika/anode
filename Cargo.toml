[workspace]
resolver = "2"
members = [
    "crates/anode",
    "crates/anode-protocol",
    "crates/anode-storage",
    "crates/anode-raft",
    "crates/anode-s3",
    "crates/anode-parquet",
    "crates/anode-client",
    "tests/harness",
    "tests/correctness",
    "tests/chaos",
    "tests/integration",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Christopher Paika"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/christopherpaika/anode"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# gRPC and protobuf
tonic = { version = "0.12", features = ["transport", "tls"] }
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Raft consensus
openraft = { version = "0.9", features = ["serde"] }

# Storage
redb = "2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Cryptography
sha2 = "0.10"
blake3 = "1.5"

# Utilities
bytes = "1.7"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"

# Parquet and Arrow
parquet = "53.0"
arrow = "53.0"
arrow-array = "53.0"
arrow-schema = "53.0"

# AWS S3
aws-config = "1.5"
aws-sdk-s3 = "1.52"
aws-smithy-types = "1.2"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
hyper = "1.4"
hyper-util = "0.1"
http-body-util = "0.1"

# Configuration
config = "0.14"
toml = "0.8"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Development dependencies
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
tempfile = "3.13"
rand = "0.8"
proptest = "1.5"
mockall = "0.13"

# Workspace crates
anode-protocol = { path = "crates/anode-protocol" }
anode-storage = { path = "crates/anode-storage" }
anode-raft = { path = "crates/anode-raft" }
anode-s3 = { path = "crates/anode-s3" }
anode-parquet = { path = "crates/anode-parquet" }
anode-client = { path = "crates/anode-client" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
