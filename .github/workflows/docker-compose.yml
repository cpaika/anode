name: Docker Compose Cluster Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'deploy/docker/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-compose.yml'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  docker-compose-cluster-test:
    name: Docker Compose 3-Node Cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS CLI (for S3 tests)
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          aws --version

      - name: Run cluster health test
        run: |
          cd deploy/docker
          ./scripts/test-cluster-health.sh

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: |
            deploy/docker/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          cd deploy/docker
          docker-compose -f docker-compose.yml down -v || true
          docker system prune -f || true
