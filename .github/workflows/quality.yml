name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy-check:
    name: Clippy Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-clippy-

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- \
            -W clippy::all

  unused-deps:
    name: Check Unused Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check for unused dependencies
        run: cargo +nightly udeps --all-targets

  msrv-check:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep -m1 'rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "msrv=$MSRV" >> $GITHUB_OUTPUT

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check with MSRV
        run: cargo check --workspace --all-features

  complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger

      - name: Run cargo-geiger
        run: cargo geiger --all-features --output-format GitHubMarkdown > geiger-report.md

      - name: Upload geiger report
        uses: actions/upload-artifact@v7
        with:
          name: geiger-report
          path: geiger-report.md

  bloat-check:
    name: Binary Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bloat
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-bloat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-bloat-

      - name: Build release binary
        run: cargo build --release

      - name: Analyze binary size
        run: |
          cargo bloat --release --crates > bloat-report.txt
          echo "## Binary Size Analysis" >> bloat-summary.md
          echo "" >> bloat-summary.md
          echo '```' >> bloat-summary.md
          cat bloat-report.txt >> bloat-summary.md
          echo '```' >> bloat-summary.md

      - name: Upload bloat report
        uses: actions/upload-artifact@v7
        with:
          name: bloat-report
          path: |
            bloat-report.txt
            bloat-summary.md

  semver-check:
    name: Semver Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-semver-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-semver-

      - name: Check semver compatibility
        run: |
          # Check semver for all public library crates
          # Skip the main binary crate (anode) as it doesn't have a public API
          for crate in anode-client anode-protocol anode-raft anode-s3 anode-storage anode-parquet; do
            echo "Checking semver compatibility for $crate..."
            cargo semver-checks check-release --package $crate || true
          done

      - name: Generate semver report
        if: always()
        run: |
          echo "## Semver Compatibility Report" > semver-report.md
          echo "" >> semver-report.md
          echo "Checked public API compatibility for library crates:" >> semver-report.md
          echo "- anode-client" >> semver-report.md
          echo "- anode-protocol" >> semver-report.md
          echo "- anode-raft" >> semver-report.md
          echo "- anode-s3" >> semver-report.md
          echo "- anode-storage" >> semver-report.md
          echo "- anode-parquet" >> semver-report.md

      - name: Upload semver report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semver-report
          path: semver-report.md

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [fmt-check, clippy-check, unused-deps, msrv-check, complexity, bloat-check, semver-check]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "- Format Check: ${{ needs.fmt-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Clippy: ${{ needs.clippy-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unused Dependencies: ${{ needs.unused-deps.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- MSRV Check: ${{ needs.msrv-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Complexity Analysis: ${{ needs.complexity.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Binary Size: ${{ needs.bloat-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Semver Compatibility: ${{ needs.semver-check.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: |
          needs.fmt-check.result == 'failure' ||
          needs.clippy-check.result == 'failure' ||
          needs.msrv-check.result == 'failure' ||
          needs.complexity.result == 'failure' ||
          needs.bloat-check.result == 'failure'
        run: |
          echo "::error::Code quality checks failed"
          exit 1
