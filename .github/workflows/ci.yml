name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-test-

      - name: Run unit tests for all core crates
        run: cargo test -p anode-storage -p anode-raft -p anode-s3 -p anode-protocol -p anode-parquet -p anode-client -p anode -p anode-test-harness -p anode-correctness-tests --all-features --verbose

      - name: Compile integration and chaos tests
        run: cargo test --no-run -p anode-integration-tests -p anode-chaos-tests --all-features

      - name: Run doc tests
        run: cargo test --workspace --doc

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-build-

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: anode-linux-amd64
          path: target/release/anode
          if-no-files-found: warn

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-doc-

      - name: Generate documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: target/doc/

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-coverage-

      - name: Generate coverage
        run: cargo llvm-cov -p anode-storage -p anode-raft -p anode-s3 -p anode-protocol -p anode-parquet -p anode-client -p anode -p anode-test-harness -p anode-correctness-tests --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.75

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-msrv-

      - name: Verify MSRV
        run: cargo build --workspace --all-features --locked

      - name: Run tests with MSRV
        run: cargo test -p anode-storage -p anode-raft -p anode-s3 -p anode-protocol -p anode-parquet -p anode-client -p anode -p anode-test-harness -p anode-correctness-tests --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-audit
        run: cargo audit --deny warnings

      - name: Run cargo-deny
        run: cargo deny check

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: anode:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image version
        run: |
          docker run --rm anode:test --version

      - name: Test Docker container starts and is healthy
        run: |
          # Create minimal config directory
          mkdir -p /tmp/anode-test/config
          mkdir -p /tmp/anode-test/data

          # Create a minimal config file for single-node bootstrap
          cat > /tmp/anode-test/config/anode.toml << 'EOF'
          [node]
          id = 1
          name = "test-node"
          s3_addr = "0.0.0.0:8080"
          grpc_addr = "0.0.0.0:9090"
          admin_addr = "0.0.0.0:8081"

          [cluster]
          name = "test-cluster"
          initial_members = []
          replication_factor = 1
          placement_groups = 16
          heartbeat_interval_ms = 1000
          election_timeout_ms = 3000

          [storage]
          data_dir = "/data"
          chunk_size = "4MB"
          sync_writes = false
          metadata_cache_size = 104857600
          io_threads = 4

          [s3]
          max_body_size = 5368709120
          request_timeout_secs = 300
          enable_multipart = true
          min_part_size = 5242880
          virtual_host_style = false

          [raft]
          snapshot_interval = 10000
          max_log_entries = 100000
          compaction_threshold = 50000
          enable_compaction = true

          [parquet]
          enable_cache = true
          cache_size = 268435456
          row_group_size = 100000
          enable_predicate_pushdown = true
          enable_column_pruning = true

          [metrics]
          enabled = true
          interval_secs = 15
          retention_secs = 0

          [logging]
          level = "info"
          json_format = true
          EOF

          # Start container in background
          CONTAINER_ID=$(docker run -d \
            --name anode-test \
            -p 8080:8080 \
            -p 8081:8081 \
            -v /tmp/anode-test/config:/config:ro \
            -v /tmp/anode-test/data:/data \
            anode:test start --config /config/anode.toml)

          echo "Started container: $CONTAINER_ID"

          # Wait for server to be ready (max 60 seconds)
          echo "Waiting for server to be ready..."
          max_attempts=60
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s http://localhost:8081/health > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Server not ready yet..."
            sleep 1
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: Server did not become ready in time"
            echo "Container logs:"
            docker logs anode-test
            docker stop anode-test
            docker rm anode-test
            exit 1
          fi

          # Test health endpoint
          echo "Testing health endpoint..."
          health_response=$(curl -f -s http://localhost:8081/health)
          echo "Health response: $health_response"

          # Test liveness endpoint
          echo "Testing liveness endpoint..."
          live_response=$(curl -f -s http://localhost:8081/live)
          echo "Live response: $live_response"

          # Test readiness endpoint
          echo "Testing readiness endpoint..."
          ready_response=$(curl -f -s http://localhost:8081/ready)
          echo "Ready response: $ready_response"

          # Stop and remove container
          echo "Stopping container..."
          docker stop anode-test
          docker rm anode-test

          # Cleanup
          rm -rf /tmp/anode-test

          echo "Docker container test completed successfully!"

  all-checks:
    name: All CI Checks
    runs-on: ubuntu-latest
    needs: [check, test, build, doc, coverage, msrv, security, docker]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs were cancelled"
            exit 1
          fi
          echo "All CI jobs passed successfully"
