# Prometheus configuration for Anode monitoring
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'anode'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/alerts.yml'
  - '/etc/prometheus/recording-rules.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Anode cluster nodes
  - job_name: 'anode'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'anode-1:9000'
          - 'anode-2:9000'
          - 'anode-3:9000'
        labels:
          cluster: 'anode-cluster'

  # Anode cluster - file-based service discovery
  # Uncomment and configure for dynamic discovery
  # - job_name: 'anode-dynamic'
  #   file_sd_configs:
  #     - files:
  #         - '/etc/prometheus/targets/anode-*.json'
  #       refresh_interval: 30s
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #     - source_labels: [node_id]
  #       target_label: node_id

  # Kubernetes service discovery (for Kubernetes deployments)
  # Uncomment when deploying to Kubernetes
  # - job_name: 'anode-kubernetes'
  #   kubernetes_sd_configs:
  #     - role: pod
  #       namespaces:
  #         names:
  #           - anode
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_label_app]
  #       action: keep
  #       regex: anode
  #     - source_labels: [__meta_kubernetes_pod_name]
  #       target_label: pod
  #     - source_labels: [__meta_kubernetes_namespace]
  #       target_label: namespace
  #     - source_labels: [__meta_kubernetes_pod_node_name]
  #       target_label: node
  #     - source_labels: [__meta_kubernetes_pod_label_node_id]
  #       target_label: node_id

  # Node exporter for system metrics (optional but recommended)
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter-1:9100'
          - 'node-exporter-2:9100'
          - 'node-exporter-3:9100'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '$1'

  # cAdvisor for container metrics (optional)
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets:
          - 'grafana:3000'

# Storage configuration
storage:
  tsdb:
    # Data retention period
    retention.time: 30d
    # Maximum storage size
    retention.size: 50GB
    # Out of order time window
    out_of_order_time_window: 30m

# Remote write configuration (optional - for long-term storage)
