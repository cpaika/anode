# Grafana dashboard provisioning configuration
apiVersion: 1

providers:
  - name: 'Anode Dashboards'
    orgId: 1
    folder: 'Anode'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
