version: '3.9'

# Extended development compose with monitoring and debugging tools
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ============================================================================
  # Anode Nodes (Extended with dev features)
  # ============================================================================
  anode-1:
    volumes:
      # Mount source code for faster iteration (hot reload if supported)
      - ../../crates:/src/crates:ro
      - ../../proto:/src/proto:ro
    environment:
      - ANODE_LOG_LEVEL=debug
      - ANODE_LOG_FORMAT=pretty
      - ANODE_ENABLE_METRICS=true
      - ANODE_ENABLE_TRACING=true
      - ANODE_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - RUST_LOG=anode=debug,openraft=debug
      - RUST_BACKTRACE=full

  anode-2:
    volumes:
      - ../../crates:/src/crates:ro
      - ../../proto:/src/proto:ro
    environment:
      - ANODE_LOG_LEVEL=debug
      - ANODE_LOG_FORMAT=pretty
      - ANODE_ENABLE_METRICS=true
      - ANODE_ENABLE_TRACING=true
      - ANODE_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - RUST_LOG=anode=debug,openraft=debug
      - RUST_BACKTRACE=full

  anode-3:
    volumes:
      - ../../crates:/src/crates:ro
      - ../../proto:/src/proto:ro
    environment:
      - ANODE_LOG_LEVEL=debug
      - ANODE_LOG_FORMAT=pretty
      - ANODE_ENABLE_METRICS=true
      - ANODE_ENABLE_TRACING=true
      - ANODE_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - RUST_LOG=anode=debug,openraft=debug
      - RUST_BACKTRACE=full

  # ============================================================================
  # Prometheus - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: anode-prometheus
    hostname: prometheus
    networks:
      - anode-net
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ============================================================================
  # Grafana - Metrics Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: anode-grafana
    hostname: grafana
    networks:
      - anode-net
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ============================================================================
  # Jaeger - Distributed Tracing
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: anode-jaeger
    hostname: jaeger
    networks:
      - anode-net
    ports:
      - "5775:5775/udp"  # Zipkin compact thrift
      - "6831:6831/udp"  # Jaeger compact thrift
      - "6832:6832/udp"  # Jaeger binary thrift
      - "5778:5778"      # Serve configs
      - "16686:16686"    # Web UI
      - "14268:14268"    # Jaeger collector HTTP
      - "14250:14250"    # Jaeger gRPC
      - "9411:9411"      # Zipkin
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=10000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ============================================================================
  # nginx - S3 Load Balancer
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: anode-nginx
    hostname: nginx
    networks:
      - anode-net
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - anode-1
      - anode-2
      - anode-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ============================================================================
  # MinIO Client - For testing S3 compatibility
  # ============================================================================
  minio-client:
    image: minio/mc:latest
    container_name: anode-mc
    networks:
      - anode-net
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set anode http://nginx:80 minioadmin minioadmin;
      mc admin info anode;
      tail -f /dev/null
      "
    depends_on:
      - nginx
    restart: unless-stopped

# ============================================================================
# Additional Volumes
# ============================================================================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
