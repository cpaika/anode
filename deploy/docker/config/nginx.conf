# nginx configuration for load balancing S3 requests across Anode nodes

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr '
                    'upstream_status: $upstream_status '
                    'request_time: $request_time '
                    'upstream_response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 5G;
    client_body_buffer_size 128k;
    proxy_buffering off;

    # Upstream configuration for Anode S3 API
    upstream anode_s3 {
        least_conn;

        server anode-1:8080 max_fails=3 fail_timeout=30s;
        server anode-2:8080 max_fails=3 fail_timeout=30s;
        server anode-3:8080 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    # Upstream configuration for Anode Admin API
    upstream anode_admin {
        least_conn;

        server anode-1:8081 max_fails=3 fail_timeout=30s;
        server anode-2:8081 max_fails=3 fail_timeout=30s;
        server anode-3:8081 max_fails=3 fail_timeout=30s;

        keepalive 16;
    }

    # Health check endpoint
    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # S3 API server
    server {
        listen 80 default_server;
        server_name _;

        # Large file upload settings
        client_max_body_size 5G;
        client_body_timeout 300s;
        proxy_request_buffering off;

        # S3 API endpoints
        location / {
            proxy_pass http://anode_s3;
            proxy_http_version 1.1;

            # Preserve headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # S3-specific headers
            proxy_set_header Authorization $http_authorization;
            proxy_set_header x-amz-content-sha256 $http_x_amz_content_sha256;
            proxy_set_header x-amz-date $http_x_amz_date;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Retry settings
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Admin endpoints (health, metrics, etc.)
        location ~ ^/(health|metrics|ready|live) {
            proxy_pass http://anode_admin;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
