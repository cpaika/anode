# Prometheus configuration for Anode development cluster

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'anode-dev'
    environment: 'development'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Anode nodes
  - job_name: 'anode-nodes'
    static_configs:
      - targets:
          - 'anode-1:8081'
          - 'anode-2:8081'
          - 'anode-3:8081'
        labels:
          cluster: 'anode-dev'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # cAdvisor for container metrics (if available)
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
    scrape_interval: 30s
