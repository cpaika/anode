# Anode Object Storage - Configuration File
# This is the main configuration file for anode nodes

# ============================================================================
# Node Configuration
# ============================================================================
[node]
# Unique node ID (1-255)
# Can be overridden by ANODE_NODE_ID environment variable
id = 1

# Human-readable node name
# Can be overridden by ANODE_NODE_NAME environment variable
name = "anode-1"

# Data directory for storage and metadata
# Can be overridden by ANODE_DATA_DIR environment variable
data_dir = "/data"

# ============================================================================
# Network Configuration
# ============================================================================
[network]
# Address to bind all services to
# Use 0.0.0.0 to bind to all interfaces
bind_addr = "0.0.0.0"

# Address to advertise to other nodes
# Should be externally routable hostname or IP
advertise_addr = "anode-1"

# S3 HTTP API port
http_port = 8080

# Admin API port (health checks, metrics, management)
admin_port = 8081

# gRPC port for inter-node communication
grpc_port = 9090

# Maximum number of concurrent connections
max_connections = 10000

# Connection timeout in seconds
connection_timeout = 30

# Request timeout in seconds
request_timeout = 300

# ============================================================================
# Cluster Configuration
# ============================================================================
[cluster]
# Whether this node should bootstrap a new cluster
# Only one node should have this set to true
bootstrap = false

# Address of an existing node to join
# Format: "hostname:port"
# Leave empty if bootstrapping
join_addr = ""

# List of all cluster peer addresses
# Format: ["host1:port", "host2:port", ...]
peers = [
    "anode-1:9090",
    "anode-2:9090",
    "anode-3:9090"
]

# Cluster ID (automatically generated on bootstrap)
# All nodes in a cluster must have the same cluster_id
cluster_id = ""

# Heartbeat interval in milliseconds
heartbeat_interval = 100

# Election timeout range in milliseconds
election_timeout_min = 150
election_timeout_max = 300

# Snapshot interval (number of log entries)
snapshot_interval = 10000

# Maximum log entries to keep after snapshot
max_log_entries = 50000

# ============================================================================
# Storage Configuration
# ============================================================================
[storage]
# Storage backend type
# Options: "file" (default)
backend = "file"

# Base directory for blob storage
blob_dir = "/data/blobs"

# Base directory for metadata database
metadata_dir = "/data/metadata"

# Chunk size for content-addressed storage (in bytes)
# Default: 4MB
chunk_size = 4194304

# Maximum object size (in bytes)
# Default: 5TB (S3 limit)
max_object_size = 5497558138880

# Enable fsync for durability (slower but safer)
fsync_enabled = true

# Enable direct I/O for blob writes
direct_io = false

# Enable memory-mapped reads for blobs
mmap_reads = true

# Blob cache size (in bytes)
# Default: 1GB
blob_cache_size = 1073741824

# Metadata cache size (in bytes)
# Default: 256MB
metadata_cache_size = 268435456

# ============================================================================
# Replication Configuration
# ============================================================================
[replication]
# Default replication factor for new buckets
default_replication_factor = 3

# Minimum replication factor allowed
min_replication_factor = 1

# Maximum replication factor allowed
max_replication_factor = 5

# Number of placement groups
# Should be ~100-200 per node for good distribution
num_placement_groups = 128

# Replication mode
# Options: "sync" (wait for replicas), "async" (background replication)
mode = "sync"

# Timeout for sync replication in seconds
sync_timeout = 10

# ============================================================================
# S3 API Configuration
# ============================================================================
[s3]
# Enable S3 API
enabled = true

# Maximum multipart upload part size (in bytes)
# Default: 5GB
max_part_size = 5368709120

# Minimum multipart upload part size (in bytes)
# Default: 5MB
min_part_size = 5242880

# Maximum number of parts per multipart upload
# Default: 10000 (S3 limit)
max_parts = 10000

# Enable virtual-hosted-style requests (bucket.domain.com)
virtual_host_style = false

# Domain for virtual-hosted-style requests
virtual_host_domain = ""

# Enable presigned URL support
presigned_urls_enabled = true

# Maximum presigned URL expiration (in seconds)
# Default: 7 days
max_presigned_expiration = 604800

# ============================================================================
# Authentication Configuration
# ============================================================================
[auth]
# Enable authentication
enabled = true

# Authentication backend
# Options: "builtin", "iam" (future)
backend = "builtin"

# Default access key (for development only!)
# In production, use separate credential management
default_access_key = "minioadmin"

# Default secret key (for development only!)
# In production, use separate credential management
default_secret_key = "minioadmin"

# Enable anonymous read access
anonymous_read = false

# Enable anonymous write access (dangerous!)
anonymous_write = false

# ============================================================================
# Parquet Configuration
# ============================================================================
[parquet]
# Enable Parquet-aware metadata caching
enabled = true

# Automatically parse Parquet metadata on upload
auto_parse = true

# Parquet metadata cache size (in bytes)
# Default: 512MB
cache_size = 536870912

# Cache eviction policy
# Options: "lru", "lfu"
eviction_policy = "lru"

# Persist cache to disk
persist_cache = true

# Cache persistence directory
cache_dir = "/data/parquet-cache"

# Enable Parquet statistics extraction
extract_statistics = true

# Enable Parquet bloom filter extraction
extract_bloom_filters = true

# ============================================================================
# Logging Configuration
# ============================================================================
[logging]
# Log level
# Options: "trace", "debug", "info", "warn", "error"
level = "info"

# Log format
# Options: "json", "pretty", "compact"
format = "json"

# Log output
# Options: "stdout", "stderr", "file"
output = "stdout"

# Log file path (if output = "file")
file_path = "/var/log/anode/anode.log"

# Maximum log file size (in bytes) before rotation
max_file_size = 104857600  # 100MB

# Number of rotated log files to keep
max_backups = 10

# Enable log compression for rotated files
compress = true

# ============================================================================
# Metrics Configuration
# ============================================================================
[metrics]
# Enable metrics collection
enabled = true

# Metrics format
# Options: "prometheus", "json"
format = "prometheus"

# Metrics endpoint path
path = "/metrics"

# Metrics collection interval (in seconds)
interval = 15

# Enable detailed metrics (may impact performance)
detailed = false

# ============================================================================
# Tracing Configuration
# ============================================================================
[tracing]
# Enable distributed tracing
enabled = false

# Tracing backend
# Options: "jaeger", "zipkin", "otlp"
backend = "jaeger"

# Jaeger endpoint (if backend = "jaeger")
jaeger_endpoint = "http://localhost:14268/api/traces"

# Jaeger agent endpoint (UDP)
jaeger_agent = "localhost:6831"

# Sampling rate (0.0 - 1.0)
# 1.0 = trace everything, 0.1 = trace 10% of requests
sampling_rate = 0.1

# ============================================================================
# Health Check Configuration
# ============================================================================
[health]
# Enable health check endpoint
enabled = true

# Health check endpoint path
path = "/health"

# Readiness check endpoint path
readiness_path = "/ready"

# Liveness check endpoint path
liveness_path = "/live"

# Health check timeout (in seconds)
timeout = 5

# ============================================================================
# Performance Tuning
# ============================================================================
[performance]
# Number of worker threads (0 = number of CPU cores)
worker_threads = 0

# Size of the async runtime's blocking thread pool
blocking_threads = 512

# Stack size for worker threads (in bytes)
thread_stack_size = 2097152  # 2MB

# Enable TCP_NODELAY (disable Nagle's algorithm)
tcp_nodelay = true

# TCP send buffer size (in bytes, 0 = system default)
tcp_send_buffer = 0

# TCP receive buffer size (in bytes, 0 = system default)
tcp_recv_buffer = 0

# Maximum pending connections in listen queue
listen_backlog = 1024

# Enable SO_REUSEADDR
so_reuseaddr = true

# Enable SO_REUSEPORT
so_reuseport = true

# ============================================================================
# Security Configuration
# ============================================================================
[security]
# Enable TLS for all connections
tls_enabled = false

# TLS certificate file
tls_cert_file = ""

# TLS private key file
tls_key_file = ""

# TLS CA certificate file (for client verification)
tls_ca_file = ""

# Require client certificates
tls_client_auth = false

# Minimum TLS version
# Options: "1.2", "1.3"
tls_min_version = "1.2"

# Enable encryption at rest
encryption_at_rest = false

# Encryption key file (for encryption at rest)
encryption_key_file = ""

# ============================================================================
# Development/Debug Configuration
# ============================================================================
[debug]
# Enable debug mode (more verbose logging, slower performance)
enabled = false

# Enable profiling endpoints (CPU, memory)
profiling_enabled = false

# Profiling endpoint path
profiling_path = "/debug/pprof"

# Enable debug assertions
assertions = false

# Panic on warnings (useful for testing)
panic_on_warn = false
