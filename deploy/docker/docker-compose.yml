version: '3.9'

# Development cluster with 3 anode nodes
# Use this for basic development and testing

services:
  # ============================================================================
  # Anode Node 1 (Bootstrap Node)
  # ============================================================================
  anode-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: anode-1
    hostname: anode-1
    networks:
      - anode-net
    ports:
      - "8080:8080"  # S3 HTTP API
      - "8081:8081"  # Admin API
      - "9090:9090"  # gRPC
    volumes:
      - anode-1-data:/data
      - ./config:/config:ro
    environment:
      - ANODE_NODE_ID=1
      - ANODE_NODE_NAME=anode-1
      - ANODE_BIND_ADDR=0.0.0.0
      - ANODE_ADVERTISE_ADDR=anode-1
      - ANODE_HTTP_PORT=8080
      - ANODE_ADMIN_PORT=8081
      - ANODE_GRPC_PORT=9090
      - ANODE_BOOTSTRAP=true
      - ANODE_CLUSTER_PEERS=anode-1:9090,anode-2:9090,anode-3:9090
      - ANODE_LOG_LEVEL=info
      - RUST_BACKTRACE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ============================================================================
  # Anode Node 2
  # ============================================================================
  anode-2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: anode-2
    hostname: anode-2
    networks:
      - anode-net
    ports:
      - "8082:8080"
      - "8083:8081"
      - "9091:9090"
    volumes:
      - anode-2-data:/data
      - ./config:/config:ro
    environment:
      - ANODE_NODE_ID=2
      - ANODE_NODE_NAME=anode-2
      - ANODE_BIND_ADDR=0.0.0.0
      - ANODE_ADVERTISE_ADDR=anode-2
      - ANODE_HTTP_PORT=8080
      - ANODE_ADMIN_PORT=8081
      - ANODE_GRPC_PORT=9090
      - ANODE_BOOTSTRAP=false
      - ANODE_CLUSTER_PEERS=anode-1:9090,anode-2:9090,anode-3:9090
      - ANODE_JOIN_ADDR=anode-1:9090
      - ANODE_LOG_LEVEL=info
      - RUST_BACKTRACE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      anode-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ============================================================================
  # Anode Node 3
  # ============================================================================
  anode-3:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: anode-3
    hostname: anode-3
    networks:
      - anode-net
    ports:
      - "8084:8080"
      - "8085:8081"
      - "9092:9090"
    volumes:
      - anode-3-data:/data
      - ./config:/config:ro
    environment:
      - ANODE_NODE_ID=3
      - ANODE_NODE_NAME=anode-3
      - ANODE_BIND_ADDR=0.0.0.0
      - ANODE_ADVERTISE_ADDR=anode-3
      - ANODE_HTTP_PORT=8080
      - ANODE_ADMIN_PORT=8081
      - ANODE_GRPC_PORT=9090
      - ANODE_BOOTSTRAP=false
      - ANODE_CLUSTER_PEERS=anode-1:9090,anode-2:9090,anode-3:9090
      - ANODE_JOIN_ADDR=anode-1:9090
      - ANODE_LOG_LEVEL=info
      - RUST_BACKTRACE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      anode-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

# ============================================================================
# Networks
# ============================================================================
networks:
  anode-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  anode-1-data:
    driver: local
  anode-2-data:
    driver: local
  anode-3-data:
    driver: local
