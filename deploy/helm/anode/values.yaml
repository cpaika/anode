# Default values for anode.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of anode replicas
replicaCount: 3

image:
  repository: anode/anode
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  # S3 API port
  s3Port: 8080
  # Admin API port
  adminPort: 8081
  # gRPC port for inter-node communication
  grpcPort: 9090
  annotations: {}
  # sessionAffinity: ClientIP

# Headless service for StatefulSet
headlessService:
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: anode.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: anode-tls
  #    hosts:
  #      - anode.example.com

persistence:
  enabled: true
  # storageClass: "fast-ssd"
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  # annotations: {}
  # selector: {}

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health/live
    port: admin
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: admin
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Startup probe for slow-starting containers
startupProbe:
  httpGet:
    path: /health/startup
    port: admin
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# Anode configuration
config:
  # Cluster configuration
  cluster:
    # Number of placement groups for data distribution (default: 128)
    # More placement groups = better distribution, but more metadata overhead
    placementGroups: 128
    # Replication factor for data redundancy
    replicationFactor: 3
    # Cluster ID (auto-generated if empty)
    clusterId: ""
    # Election timeout in milliseconds (default: 3000)
    # Should be significantly larger than heartbeat_interval_ms
    electionTimeoutMs: 3000
    # Heartbeat interval in milliseconds (default: 1000)
    heartbeatIntervalMs: 1000

  # Storage configuration
  storage:
    # Chunk size for object splitting
    chunkSize: "4MB"
    # Data directory (mounted from PVC)
    dataDir: /data
    # Whether to sync writes to disk (fsync)
    syncWrites: false
    # Maximum cache size for metadata in bytes (default: 100MB)
    metadataCacheSize: 104857600
    # Number of worker threads for I/O operations (0 = auto-detect CPU cores)
    ioThreads: 0

  # S3 API configuration
  s3:
    # Maximum request body size in bytes (default: 5GB)
    maxBodySize: 5368709120
    # Request timeout in seconds
    requestTimeoutSecs: 300
    # Enable multipart upload support
    enableMultipart: true
    # Minimum part size for multipart uploads (5MB minimum per S3 spec)
    minPartSize: 5242880
    # Virtual host style (true) or path style (false)
    virtualHostStyle: false

  # Parquet-aware features
  parquet:
    # Enable Parquet metadata caching
    enableCache: true
    # Parquet cache size in bytes (default: 256MB)
    cacheSize: 268435456
    # Number of rows per row group
    rowGroupSize: 100000
    # Enable predicate pushdown optimization
    enablePredicatePushdown: true
    # Enable column pruning optimization
    enableColumnPruning: true

  # Raft consensus configuration
  raft:
    # Snapshot interval in log entries
    snapshotInterval: 10000
    # Maximum number of log entries to keep in memory
    maxLogEntries: 100000
    # Compaction threshold - trigger compaction after this many log entries
    compactionThreshold: 50000
    # Enable log compaction
    enableCompaction: true

  # Logging configuration
  logging:
    # Log level: trace, debug, info, warn, error
    level: info
    # Enable JSON formatted logs
    jsonFormat: true
    # Log file path (empty = stdout only)
    file: ""
    # Enable log rotation
    rotate: false
    # Maximum log file size before rotation in bytes (default: 100MB)
    maxSize: 104857600

  # Metrics configuration
  metrics:
    # Enable Prometheus metrics
    enabled: true
    # Metrics collection interval in seconds
    intervalSecs: 15
    # Retention period for metrics in seconds (0 = infinite)
    retentionSecs: 0

# S3 credentials (will be stored in a Secret)
s3Credentials:
  # Create default admin credentials
  admin:
    accessKey: "admin"
    # secretKey will be auto-generated if empty
    secretKey: ""

# TLS configuration
tls:
  enabled: false
  # Use cert-manager to generate certificates
  certManager:
    enabled: false
    issuerName: "letsencrypt-prod"
    issuerKind: "ClusterIssuer"
  # Or provide your own certificates
  # secretName: anode-tls-secret
  # The secret should contain: tls.crt, tls.key, ca.crt

# Monitoring with Prometheus Operator
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    # namespace: monitoring  # Optional: deploy ServiceMonitor to different namespace
    # namespaceSelector: {}  # Optional: select namespaces to monitor
    # scheme: http  # Optional: http or https
    # tlsConfig: {}  # Optional: TLS configuration
    relabelings: []
    metricRelabelings: []
    # targetLabels: []  # Optional: labels to transfer from service to metrics
    # podTargetLabels: []  # Optional: labels to transfer from pod to metrics

  prometheusRule:
    enabled: false
    labels: {}
    annotations: {}
    # namespace: monitoring  # Optional: deploy PrometheusRule to different namespace
    additionalRules: []
    # - alert: CustomAlert
    #   expr: custom_metric > 100
    #   for: 5m
    #   labels:
    #     severity: warning
    #   annotations:
    #     summary: "Custom alert"

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2
  # maxUnavailable: 1

# Update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

# Pod Management Policy
podManagementPolicy: OrderedReady

# Revision History Limit
revisionHistoryLimit: 10

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity and anti-affinity
affinity: {}
  # Example: spread pods across nodes
  # podAntiAffinity:
  #   preferredDuringSchedulingIgnoredDuringExecution:
  #   - weight: 100
  #     podAffinityTerm:
  #       labelSelector:
  #         matchExpressions:
  #         - key: app.kubernetes.io/name
  #           operator: In
  #           values:
  #           - anode
  #       topologyKey: kubernetes.io/hostname

# Topology Spread Constraints
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: anode

# Priority Class
priorityClassName: ""

# Enable network policies
networkPolicy:
  enabled: false
  # Ingress rules
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: anode
      ports:
      - protocol: TCP
        port: 9090
    - from: []
      ports:
      - protocol: TCP
        port: 8080
      - protocol: TCP
        port: 8081
  # Egress rules
  egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: anode
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53

# Additional environment variables
extraEnv: []
  # - name: RUST_BACKTRACE
  #   value: "1"

# Additional volumes
extraVolumes: []
  # - name: custom-config
  #   configMap:
  #     name: custom-config

# Additional volume mounts
extraVolumeMounts: []
  # - name: custom-config
  #   mountPath: /etc/anode/custom

# Init containers
initContainers: []
  # - name: wait-for-dns
  #   image: busybox:1.36
  #   command: ['sh', '-c', 'until nslookup anode-headless; do sleep 2; done']

# Sidecar containers
sidecarContainers: []

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 15

# Graceful termination period
terminationGracePeriodSeconds: 30
