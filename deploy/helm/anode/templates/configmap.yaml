apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anode.configMapName" . }}
  labels:
    {{- include "anode.labels" . | nindent 4 }}
data:
  config.toml: |
    # Anode Configuration File
    # Auto-generated by Helm chart

    [cluster]
    # Cluster identification
    cluster_id = "{{ include "anode.clusterId" . }}"

    # Number of placement groups for data distribution
    placement_groups = {{ .Values.config.cluster.placementGroups }}

    # Replication factor for data redundancy
    replication_factor = {{ .Values.config.cluster.replicationFactor }}

    # Raft election timeout in milliseconds
    election_timeout_ms = {{ .Values.config.cluster.electionTimeoutMs }}

    # Raft heartbeat interval in milliseconds
    heartbeat_interval_ms = {{ .Values.config.cluster.heartbeatIntervalMs }}

    [node]
    # Node ID is set via environment variable ANODE_NODE_ID
    # node_id = "${ANODE_NODE_ID}"

    # Node addresses
    s3_addr = "0.0.0.0:{{ .Values.service.s3Port }}"
    admin_addr = "0.0.0.0:{{ .Values.service.adminPort }}"
    grpc_addr = "0.0.0.0:{{ .Values.service.grpcPort }}"

    # Bootstrap nodes (headless service DNS)
    {{- $fullname := include "anode.fullname" . }}
    {{- $headlessService := include "anode.headlessServiceName" . }}
    {{- $namespace := .Release.Namespace }}
    {{- $grpcPort := .Values.service.grpcPort }}
    bootstrap_nodes = [
      {{- range $i := until (int .Values.replicaCount) }}
      "{{ $fullname }}-{{ $i }}.{{ $headlessService }}.{{ $namespace }}.svc.cluster.local:{{ $grpcPort }}",
      {{- end }}
    ]

    [storage]
    # Data directory
    data_dir = "{{ .Values.config.storage.dataDir }}"

    # Chunk size for object splitting
    chunk_size = "{{ .Values.config.storage.chunkSize }}"

    # Enable direct I/O
    direct_io = {{ .Values.config.storage.directIO }}

    # Sync policy: "always", "periodic", or "never"
    sync_policy = "{{ .Values.config.storage.syncPolicy }}"

    # Sync interval in seconds (if periodic)
    sync_interval_secs = {{ .Values.config.storage.syncIntervalSecs }}

    [s3]
    # Enable S3 API
    enabled = {{ .Values.config.s3.enabled }}

    # Virtual host style (true) or path style (false)
    virtual_host_style = {{ .Values.config.s3.virtualHostStyle }}

    # Maximum object size
    max_object_size = "{{ .Values.config.s3.maxObjectSize }}"

    [s3.multipart]
    # Multipart upload configuration
    min_part_size = "{{ .Values.config.s3.multipart.minPartSize }}"
    max_part_size = "{{ .Values.config.s3.multipart.maxPartSize }}"
    max_parts = {{ .Values.config.s3.multipart.maxParts }}

    [parquet]
    # Enable parquet metadata caching
    cache_enabled = {{ .Values.config.parquet.cacheEnabled }}

    # Cache size in MB
    cache_size_mb = {{ .Values.config.parquet.cacheSizeMb }}

    # Auto-detect parquet files
    auto_detect = {{ .Values.config.parquet.autoDetect }}

    # Cache metadata for these file extensions
    extensions = {{ .Values.config.parquet.extensions | toJson }}

    [logging]
    # Log level: trace, debug, info, warn, error
    level = "{{ .Values.config.logging.level }}"

    # Log format: json or text
    format = "{{ .Values.config.logging.format }}"

    # Log to stdout
    stdout = {{ .Values.config.logging.stdout }}

    {{- if .Values.config.logging.file.enabled }}
    [logging.file]
    enabled = true
    path = "{{ .Values.config.logging.file.path }}"
    max_size_mb = {{ .Values.config.logging.file.maxSizeMb }}
    max_backups = {{ .Values.config.logging.file.maxBackups }}
    {{- end }}

    [metrics]
    # Enable metrics
    enabled = {{ .Values.config.metrics.enabled }}

    # Metrics format: prometheus
    format = "{{ .Values.config.metrics.format }}"

    # Metrics endpoint path
    path = "{{ .Values.config.metrics.path }}"

    {{- if .Values.tls.enabled }}
    [tls]
    enabled = true
    cert_path = "/etc/anode/tls/tls.crt"
    key_path = "/etc/anode/tls/tls.key"
    {{- if .Values.tls.certManager.enabled }}
    ca_path = "/etc/anode/tls/ca.crt"
    {{- end }}
    {{- end }}
