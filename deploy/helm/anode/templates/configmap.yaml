apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anode.configMapName" . }}
  labels:
    {{- include "anode.labels" . | nindent 4 }}
data:
  config.toml: |
    # Anode Configuration File
    # Auto-generated by Helm chart

    [node]
    # Node ID - will be derived from pod ordinal (1-based)
    # This is a placeholder; actual id will be set from ANODE_NODE_ID environment variable
    id = 1

    # Human-readable node name
    # This is a placeholder; actual name will be set from ANODE_POD_NAME environment variable
    name = "anode-node"

    # Node addresses
    s3_addr = "0.0.0.0:{{ .Values.service.s3Port }}"
    admin_addr = "0.0.0.0:{{ .Values.service.adminPort }}"
    grpc_addr = "0.0.0.0:{{ .Values.service.grpcPort }}"

    [cluster]
    # Cluster name
    name = "{{ include "anode.clusterId" . }}"

    # Initial cluster members (headless service DNS)
    {{- $fullname := include "anode.fullname" . }}
    {{- $headlessService := include "anode.headlessServiceName" . }}
    {{- $namespace := .Release.Namespace }}
    {{- $grpcPort := .Values.service.grpcPort }}
    initial_members = [
      {{- range $i := until (int .Values.replicaCount) }}
      "{{ $fullname }}-{{ $i }}.{{ $headlessService }}.{{ $namespace }}.svc.cluster.local:{{ $grpcPort }}",
      {{- end }}
    ]

    # Number of placement groups for data distribution
    placement_groups = {{ int .Values.config.cluster.placementGroups }}

    # Replication factor for data redundancy
    replication_factor = {{ int .Values.config.cluster.replicationFactor }}

    # Raft heartbeat interval in milliseconds
    heartbeat_interval_ms = {{ int .Values.config.cluster.heartbeatIntervalMs }}

    # Raft election timeout in milliseconds
    election_timeout_ms = {{ int .Values.config.cluster.electionTimeoutMs }}

    [storage]
    # Data directory
    data_dir = "{{ .Values.config.storage.dataDir }}"

    # Chunk size for object splitting
    chunk_size = "{{ .Values.config.storage.chunkSize }}"

    # Whether to sync writes to disk (fsync)
    sync_writes = {{ .Values.config.storage.syncWrites }}

    # Maximum cache size for metadata in bytes
    metadata_cache_size = {{ int .Values.config.storage.metadataCacheSize }}

    # Number of worker threads for I/O operations
    io_threads = {{ int .Values.config.storage.ioThreads }}

    [s3]
    # Maximum request body size in bytes
    max_body_size = {{ int .Values.config.s3.maxBodySize }}

    # Request timeout in seconds
    request_timeout_secs = {{ int .Values.config.s3.requestTimeoutSecs }}

    # Enable multipart upload support
    enable_multipart = {{ .Values.config.s3.enableMultipart }}

    # Minimum part size for multipart uploads (5MB minimum per S3 spec)
    min_part_size = {{ int .Values.config.s3.minPartSize }}

    # Virtual host style (true) or path style (false)
    virtual_host_style = {{ .Values.config.s3.virtualHostStyle }}

    [raft]
    # Snapshot interval in log entries
    snapshot_interval = {{ int .Values.config.raft.snapshotInterval }}

    # Maximum number of log entries to keep in memory
    max_log_entries = {{ int .Values.config.raft.maxLogEntries }}

    # Compaction threshold - trigger compaction after this many log entries
    compaction_threshold = {{ int .Values.config.raft.compactionThreshold }}

    # Enable log compaction
    enable_compaction = {{ .Values.config.raft.enableCompaction }}

    [parquet]
    # Enable Parquet metadata caching
    enable_cache = {{ .Values.config.parquet.enableCache }}

    # Parquet cache size in bytes
    cache_size = {{ int .Values.config.parquet.cacheSize }}

    # Number of rows per row group
    row_group_size = {{ int .Values.config.parquet.rowGroupSize }}

    # Enable predicate pushdown optimization
    enable_predicate_pushdown = {{ .Values.config.parquet.enablePredicatePushdown }}

    # Enable column pruning optimization
    enable_column_pruning = {{ .Values.config.parquet.enableColumnPruning }}

    [metrics]
    # Enable Prometheus metrics
    enabled = {{ .Values.config.metrics.enabled }}

    # Metrics collection interval in seconds
    interval_secs = {{ int .Values.config.metrics.intervalSecs }}

    # Retention period for metrics in seconds (0 = infinite)
    retention_secs = {{ int .Values.config.metrics.retentionSecs }}

    [logging]
    # Log level: trace, debug, info, warn, error
    level = "{{ .Values.config.logging.level }}"

    # Enable JSON formatted logs
    json_format = {{ .Values.config.logging.jsonFormat }}

    {{- if .Values.config.logging.file }}
    # Log file path
    file = "{{ .Values.config.logging.file }}"
    {{- end }}

    # Enable log rotation
    rotate = {{ .Values.config.logging.rotate }}

    # Maximum log file size before rotation (in bytes)
    max_size = {{ int .Values.config.logging.maxSize }}
