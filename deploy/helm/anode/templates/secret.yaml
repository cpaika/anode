apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anode.secretName" . }}
  labels:
    {{- include "anode.labels" . | nindent 4 }}
type: Opaque
stringData:
  # S3 Admin Credentials
  s3-access-key: {{ .Values.s3Credentials.admin.accessKey | quote }}
  s3-secret-key: {{ include "anode.s3SecretKey" . | quote }}

  # Additional credentials can be added here
  credentials.json: |
    {
      "users": [
        {
          "access_key": "{{ .Values.s3Credentials.admin.accessKey }}",
          "secret_key": "{{ include "anode.s3SecretKey" . }}",
          "display_name": "Administrator",
          "permissions": ["admin"]
        }
      ]
    }
