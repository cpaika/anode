[package]
name = "anode-s3"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
hyper = "1.5"
bytes = "1.8"
quick-xml = { version = "0.37", features = ["serialize"] }
base64 = { version = "0.22", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.42", features = ["full"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
anode-protocol = { path = "../anode-protocol" }
anode-storage = { path = "../anode-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
tempfile = "3.0"
md5 = "0.7"
proptest = "1.0"
urlencoding = "2.1"
arrow = "54.0"
parquet = "59.0"
