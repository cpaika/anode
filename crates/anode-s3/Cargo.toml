[package]
name = "anode-s3"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
hyper = "1.5"
bytes = "1.8"
quick-xml = { version = "0.37", features = ["serialize"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.42", features = ["full"] }
chrono = "0.4"
anode-protocol = { path = "../anode-protocol" }
anode-storage = { path = "../anode-storage" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
tempfile = "3.0"
