[package]
name = "anode-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
redb = "4.1"
sha2 = "0.10"
bytes = "1.8"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.42", features = ["full"] }
anode-protocol = { path = "../anode-protocol" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
chrono = "0.4"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"
futures = "0.3"
proptest = "1.0"
