[package]
name = "anode-parquet"
version = "0.1.0"
edition = "2021"

[dependencies]
parquet = "54.0"
arrow = "59.2"
bytes = "1.8"
lru = "0.12"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anode-protocol = { path = "../anode-protocol" }
anode-storage = { path = "../anode-storage" }

[dev-dependencies]
tempfile = "3.14"
