syntax = "proto3";
package anode.cluster;

import "common.proto";

service ClusterService {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (ClusterStatus);
  rpc GetNodeStatus(GetNodeStatusRequest) returns (NodeStatus);
}

message JoinRequest {
  anode.common.NodeId node_id = 1;
  string address = 2;
}

message JoinResponse {
  bool success = 1;
  string error = 2;
  ClusterStatus cluster = 3;
}

message LeaveRequest {
  anode.common.NodeId node_id = 1;
}

message LeaveResponse {
  bool success = 1;
  string error = 2;
}

message GetClusterStatusRequest {}

message ClusterStatus {
  anode.common.ClusterId cluster_id = 1;
  repeated NodeInfo nodes = 2;
  repeated anode.common.PlacementGroup placement_groups = 3;
  anode.common.NodeId leader = 4;
}

message GetNodeStatusRequest {
  anode.common.NodeId node_id = 1;
}

message NodeStatus {
  anode.common.NodeId node_id = 1;
  NodeState state = 2;
  uint64 disk_total = 3;
  uint64 disk_used = 4;
  uint64 objects_count = 5;
  uint64 chunks_count = 6;
}

message NodeInfo {
  anode.common.NodeId node_id = 1;
  string address = 2;
  NodeState state = 3;
}

enum NodeState {
  NODE_STATE_UNKNOWN = 0;
  NODE_STATE_JOINING = 1;
  NODE_STATE_ACTIVE = 2;
  NODE_STATE_LEAVING = 3;
  NODE_STATE_DOWN = 4;
}
