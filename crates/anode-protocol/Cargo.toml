[package]
name = "anode-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.13"
tonic = "0.12"
bytes = "1.8"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
tracing = "0.1"
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

[build-dependencies]
tonic-build = "0.14"
