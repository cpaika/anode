[package]
name = "anode-raft"
version = "0.1.0"
edition = "2021"

[dependencies]
openraft = { version = "0.9", features = ["serde"] }
anode-protocol = { path = "../anode-protocol" }
anode-storage = { path = "../anode-storage" }
tokio = { version = "1.42", features = ["full"] }
tonic = "0.12"
tracing = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
redb = "2.2"
bincode = "1.3"
async-trait = "0.1"
parking_lot = "0.12"
bytes = "1.8"

[dev-dependencies]
tempfile = "3.13"
tokio-test = "0.4"
